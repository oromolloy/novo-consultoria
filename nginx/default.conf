# Site estático — bloqueio explícito de /docs/ (403)
server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location ~* ^/docs(/|$) {
        access_log off;
        log_not_found off;
        return 403;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
